<!doctype html><html lang="fr"><meta charset="utf-8"><title>Run-IQ, le bleu reprend l'arête</title>
<style>
@font-face{font-family:I;src:local("Inter")} *{margin:0;box-sizing:border-box}
body{font-family:I;background:#0B0B0B;color:#F2F1EC;padding:48px;display:flex;flex-direction:column;gap:24px;--accent:#2F5BEA}
h1{font-weight:600;letter-spacing:-1px} p.i{color:#A5A5A1;max-width:900px;line-height:1.5}
.row{display:flex;gap:28px;flex-wrap:wrap} .c{display:flex;flex-direction:column;gap:12px;width:360px}
.b{height:360px;display:grid;place-items:center;border-radius:16px} .b svg{width:210px;height:210px;overflow:visible}
.dark{background:#141414;color:#F2F1EC}.light{background:#F2F1EC;color:#0B0B0B}
.l{font-weight:600;font-size:18px}.d{color:#A5A5A1;font-size:14px;line-height:1.45}
button{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid #333;background:#1c1c1c;color:#F2F1EC;cursor:pointer;align-self:flex-start}
</style><body>
<h1>Run-IQ : le bleu reprend l'arête</h1>
<p class="i">La boucle respire et avance d'un tiers, en emportant le bleu. Puis le bleu se détache et remonte le long de l'arc jusqu'au sommet, où il se pose sur le noeud qui vient d'arriver. À l'arrêt, il est donc toujours en haut.</p>
<div class="row" id="row"></div>
<script>
const NS='http://www.w3.org/2000/svg',R=31,C=50,SW=10,GAP=30,NODES=[-90,30,150],T=2600,SPLIT=.5;
const rad=a=>a*Math.PI/180,P=(a,r=R)=>[C+r*Math.cos(rad(a)),C+r*Math.sin(rad(a))];
const arcD=(a0,a1)=>{if(a1<a0)[a0,a1]=[a1,a0];const[x0,y0]=P(a0),[x1,y1]=P(a1);return `M${x0} ${y0} A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const ARCS=NODES.map((n,i)=>{let a0=n+GAP,a1=NODES[(i+1)%3]-GAP;if(a1<=a0)a1+=360;return[a0,a1]});
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, clamp=x=>Math.max(0,Math.min(1,x));
let uid=0;
function build(trail){const s=el('svg',{viewBox:'0 0 100 100'}),id='k'+(uid++);
  const mask=el('mask',{id},el('defs',{},s));ARCS.forEach(([a0,a1])=>el('path',{d:arcD(a0,a1),fill:'none',stroke:'#fff','stroke-width':SW,'stroke-linecap':'round'},mask));
  const rg=el('g',{},s);const ring=el('g',{fill:'none',stroke:'currentColor','stroke-width':SW,'stroke-linecap':'round'},rg);
  const arcs=ARCS.map(([a0,a1])=>el('path',{d:arcD(a0,a1),pathLength:100},ring));
  const nodes=NODES.map(a=>{const[x,y]=P(a);return el('circle',{cx:x,cy:y,r:7.5,fill:'currentColor'},rg)});
  const tg=el('g',{mask:`url(#${id})`},s);const segs=trail?[...Array(28)].map(()=>el('path',{fill:'none',stroke:'var(--accent)','stroke-width':SW},tg)):[];
  const dep=el('circle',{r:7.5,fill:'var(--accent)'},s),arr=el('circle',{r:7.5,fill:'var(--accent)'},s);
  const dot=el('circle',{r:7.5,fill:'var(--accent)'},s);return{s,rg,arcs,nodes,segs,dot,dep,arr}}
function card(title,desc,trail){const c=document.createElement('div');c.className='c';const Ls=[];
  for(const th of['dark','light']){const b=document.createElement('div');b.className='b '+th;const L=build(trail);b.appendChild(L.s);c.appendChild(b);Ls.push(L)}
  c.insertAdjacentHTML('beforeend',`<div class="l">${title}</div><div class="d">${desc}</div>`);
  const btn=document.createElement('button');c.appendChild(btn);row.appendChild(c);
  let running=true,t0=performance.now(),stopCycle=null;
  const label=()=>btn.textContent=running?'Arrêter le chargement':'Relancer le chargement';label();
  btn.onclick=()=>{if(running){running=false;stopCycle=null}else{running=true;t0=performance.now()-((performance.now()-t0)%T)}label()};
  (function f(now){let e=now-t0,k=Math.floor(e/T),u=(e%T)/T;
    if(!running){if(stopCycle===null)stopCycle=k;if(k>stopCycle){k=stopCycle;u=1}}
    // phase 1 : la boucle respire et avance d'un tiers en emportant le bleu
    const p1=clamp(u/SPLIT),rot=120*ease(p1),o=Math.sin(p1*Math.PI);
    // phase 2 : le bleu remonte l'arête, de 30° (en bas à droite) jusqu'au sommet (-90°)
    const p2=clamp((u-SPLIT)/(1-SPLIT)),slide=ease(p2);
    const head=u<SPLIT?-90+rot:30-120*slide;
    Ls.forEach(L=>{L.rg.style.transformOrigin='50px 50px';L.rg.style.transform=`rotate(${rot%120===0&&u>=SPLIT?0:rot}deg)`;
      L.arcs.forEach(a=>{a.style.strokeDasharray=`${100-30*o} 100`;a.style.strokeDashoffset=`${-15*o}`});
      L.nodes.forEach(n=>n.setAttribute('r',7.5-1.5*o));
      // phase 1 : le bleu est le noeud 0, emporté par la boucle (on masque le noeud crème dessous)
      // phase 2 : fondu croisé — le noeud de départ redevient crème, le bleu glisse en trace, le sommet devient bleu
      const sm=x=>x*x*(3-2*x), bell=u<SPLIT?0:Math.sin(Math.PI*p2);
      const dep=u<SPLIT?1:1-sm(clamp(p2/.4)), arr=u<SPLIT?0:sm(clamp((p2-.6)/.4));
      const r=7.5-1.5*o;
      L.nodes.forEach((n,i)=>n.setAttribute('opacity',u<SPLIT&&i===0?0:1)); // le crème reste plein : le bleu s'y fond par-dessus
      const put=(c,ang,op,rr)=>{const[x,y]=P(ang);c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('opacity',op.toFixed(3));c.setAttribute('r',rr.toFixed(2))};
      if(u<SPLIT){put(L.dot,head,1,r);L.dep.setAttribute('opacity',0);L.arr.setAttribute('opacity',0)}
      else{put(L.dep,30,dep,r+.35);put(L.arr,-90,arr,r+.35);put(L.dot,head,.5*bell,r*(1-.4*bell))}
      // trace : même cloche ; profil symétrique ; limitée à l'arc parcouru
      const N=L.segs.length,LEN=80*bell,PEAK=.4*bell;
      L.segs.forEach((sg,i)=>{const lo=Math.max(-60,Math.min(0,head+LEN*i/N)),hi=Math.max(-60,Math.min(0,head+LEN*(i+1)/N));
        if(u<SPLIT||hi<=lo+.01){sg.setAttribute('d','');return}
        sg.setAttribute('d',arcD(lo,hi));sg.setAttribute('stroke-opacity',(PEAK*Math.sin(Math.PI*(i+.5)/N)).toFixed(3))});
    });
    if(!location.hash)requestAnimationFrame(f)})(location.hash?t0+ +location.hash.slice(1):t0);}
card('E2, version douce','Le bleu s\'efface doucement en quittant le noeud, glisse le long de l\'arc sous forme de trace, puis se reforme au sommet. La trace est fine aux deux bouts et pleine au milieu.',true);
</script></body></html>
